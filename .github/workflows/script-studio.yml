name: Script studio
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'assets/**'
      - 'frontend/**'
      - 'tests/**'
      - 'tools/build_frontend.ps1'
      - 'tools/build_mouse_guard.ps1'
      - 'native/background_mouse_guard/**'
      - 'tools/build_navigation.py'
      - 'tools/build_script_tasks.py'
      - 'tools/build_bounty_tasks.py'
      - 'tools/navigation_library.json'
      - 'tools/script_task_profiles.json'
      - 'tools/bounty_task_template.json'
      - 'tools/migrate_zaomeng_scripts.py'
      - 'tools/import_navigation_library.py'
      - 'tools/configure_task_navigation.py'
      - 'tools/configure_game_management.py'
      - 'tools/research/**'
      - 'tools/benchmark_task_config.py'
      - 'tools/navigation_privacy_masks.json'
      - 'tools/sync_task_assets.py'
      - 'tools/build_release.py'
      - 'tools/build_sfx.py'
      - 'tools/build_installer.py'
      - 'tools/installer/**'
      - 'tools/runtime_check.py'
      - 'tools/setup_runtime.py'
      - 'DependencySetup_依赖库安装_win.bat'
      - 'tools/install.py'
      - 'tools/launcher/**'
      - 'tools/build_launcher.ps1'
      - 'docs/zh_cn/更新协议与发布规范.md'
      - '新图标.ico'
      - '.github/workflows/script-studio.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development-only catalogue parser dependencies
        run: python -m pip install beautifulsoup4==4.15.0 requests==2.34.2
      - name: Offline recording, import, editing and playback tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Live-view connection and completed-frame failure regression
        env:
          LIVEVIEW_PATCH_TESTS: '1'
        run: python -m unittest discover -s tests -p "test_liveview_patch.py" -v
      - name: Live-view target generation and collapsed-card checks
        shell: pwsh
        run: dotnet run --project frontend/tests/LiveView/LiveView.csproj -c Release
      - name: Agent process ownership and cleanup regression
        env:
          AGENT_CLEANUP_PATCH_TESTS: '1'
        run: python -m unittest discover -s tests -p "test_agent_cleanup_patch.py" -v
      - name: Native task recovery policy checks without processes or input
        shell: pwsh
        run: dotnet run --project frontend/tests/NativeRecovery/NativeRecovery.csproj -c Release
      - name: Script page lifecycle and controller reuse checks
        shell: pwsh
        run: dotnet run --project frontend/tests/StudioPage/StudioPage.csproj -c Release
      - name: Script worker disconnect and protocol fault injection
        shell: pwsh
        run: dotnet run --project frontend/tests/StudioClient/StudioClient.csproj -c Release
      - name: Offline game database search and page lifecycle checks
        shell: pwsh
        run: dotnet run --project frontend/tests/GameDatabase/GameDatabase.csproj -c Release
      - name: Game management controls and instance settings without game processes
        shell: pwsh
        run: dotnet run --project frontend/tests/GameManagement/GameManagement.csproj -c Release
      - name: ZIP personal backup, restore and interruption recovery without external tools
        shell: pwsh
        run: dotnet run --project frontend/tests/PersonalTransfer/PersonalTransfer.csproj -c Release
      - name: Build native MFAAvalonia page
        shell: pwsh
        run: ./tools/build_frontend.ps1
      - name: Build and verify scoped background mouse guard
        shell: pwsh
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'mouse-guard'
          ./tools/build_mouse_guard.ps1 -OutputDirectory $guard -BuildTests
          $env:MAA_MOUSE_GUARD_TEST_DLL = Join-Path $guard 'MaaBackgroundMouseGuard.dll'
          $env:MAA_MOUSE_GUARD_TEST_HOST = Join-Path $guard 'tests/mouse_guard_host.exe'
          python -B -m unittest discover -s tests -p 'test_background_mouse_guard_native.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Background mouse guard IPC tests failed.' }
          Copy-Item -LiteralPath (Join-Path $guard 'MaaBackgroundMouseGuard.dll'), (Join-Path $guard 'mouse-guard-build.json') -Destination 'dist/script-studio/runtimes/win-x64/native/'
      - name: Install pinned memory-only Maa regression dependencies
        run: python -m pip install maafw==5.12.3 numpy==2.2.6 pillow==12.2.0
      - name: Guard cleanup failure over real Agent IPC
        env:
          MAA_AGENT_NATIVE_TESTS: '1'
          MAAFW_BINARY_PATH: '${{ github.workspace }}/dist/script-studio/runtimes/win-x64/native'
          MAAZMXY4_TEST_LOG_DIR: '${{ runner.temp }}/guard-playback-ipc'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p "test_battle_playback_transport.py" -k guard_failure -v
      - name: Blood-sea endpoint recovery on stored pixels
        env:
          NAVIGATION_NATIVE_TESTS: '1'
          MAAFW_BINARY_PATH: '${{ github.workspace }}/dist/script-studio/runtimes/win-x64/native'
          NAVIGATION_SCROLL_TEST_LOG: '${{ runner.temp }}/navigation-native/scroll'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p "test_game_management_scroll.py" -v
      - name: Native speed confirmation on synthetic pixels
        env:
          NAVIGATION_NATIVE_TESTS: '1'
          MAAFW_BINARY_PATH: '${{ github.workspace }}/dist/script-studio/runtimes/win-x64/native'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p "test_box_speed_native.py" -v
      - name: Endpoint reuse and missed entry clicks over real Agent IPC
        env:
          MAA_AGENT_NATIVE_TESTS: '1'
          MAAFW_BINARY_PATH: '${{ github.workspace }}/dist/script-studio/runtimes/win-x64/native'
          STAGE_ENTRY_TEST_LOG: '${{ runner.temp }}/navigation-native/entry'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p "test_stage_entry_transport.py" -v
      - name: Entry press ordering and small-window settings recognition
        env:
          NAVIGATION_NATIVE_TESTS: '1'
          MAA_RESULT_UI_TESTS: '1'
          MAAFW_BINARY_PATH: '${{ github.workspace }}/dist/script-studio/runtimes/win-x64/native'
          MAA_RESULT_TEST_LOG: '${{ runner.temp }}/navigation-native/settings'
          OMP_NUM_THREADS: '2'
        run: |
          python -m unittest discover -s tests -p "test_entry_press_native.py" -v
          python -m unittest discover -s tests -p "test_settings_ui_native.py" -v
      - name: Built task options and AFK dependencies without a real window
        shell: pwsh
        run: dotnet run --project frontend/tests/TaskOptions/TaskOptions.csproj -c Release -- assets/interface.json
      - name: Built ZIP migration page and early startup restore contract (headless)
        shell: pwsh
        run: dotnet run --project frontend/tests/PersonalTransferUi/PersonalTransferUi.csproj -c Release -- "${{ runner.temp }}/personal-transfer-renders"
      - name: Build the manual-install project launcher
        shell: pwsh
        run: ./tools/build_launcher.ps1
      - name: Save synthetic migration page screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-transfer-headless-screenshots
          path: ${{ runner.temp }}/personal-transfer-renders/*.png
          if-no-files-found: warn
      - name: Save memory-only navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-native-regression
          path: ${{ runner.temp }}/navigation-native/
          if-no-files-found: warn
      - name: Save frontend for assembling the manually distributed client
        uses: actions/upload-artifact@v4
        with:
          name: script-studio-frontend-win-x64
          path: |
            dist/script-studio/MFAAvalonia.*
            dist/script-studio/libloader.dll
            dist/script-studio/libs/
            dist/script-studio/runtimes/win-x64/native/
            dist/script-studio/script-studio-build.json
            dist/script-studio/LICENSE-MFAAvalonia.txt
          if-no-files-found: error
