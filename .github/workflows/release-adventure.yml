name: release-adventure

# 触发方式：
#   1. 打 tag 自动触发（推荐）：git tag v1.2 && git push origin v1.2
#   2. 手动触发：Actions 页面 → release-adventure → Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.2），留空则用当前 ref"
        required: false
        default: ""

# 两个 workflow 都会在打 tag 时触发，串行化避免同时创建同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write   # 创建 release 需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MaaFw
        run: |
          python -m pip install --upgrade pip
          python -m pip install MaaFw

      # 先跑离线测试：任何断言失败就直接中断，不会发出有问题的包
      - name: Run offline tests
        run: python tools/test_agent_offline.py

      # 结构自检：确认 ROI 与 adventure_ui.json 一致、任务入口都能解析
      - name: Check pipeline structure
        run: python tools/check_adventure.py

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py \
            --schema-dir deps/tools \
            --resource-dirs assets/resource \
            --exclude-dirs assets/resource/announcement \
            --interface-files assets/interface.json

      # 版本号优先取 tag 名（v1.2 → 1.2）
      - name: Build release package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
            VER="${VER#v}"
          fi
          echo "打包版本: $VER"
          python tools/build_release.py --version "$VER" --out dist
          ls -lh dist/

      - name: Upload artifact (供手动下载)
        uses: actions/upload-artifact@v4
        with:
          name: survival-adventure-slim
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
